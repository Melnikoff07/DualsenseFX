; adaptive_triggers: адаптивные триггеры DualSense для BotW 1.6.0
; Строки с ';' в начале - комментарии. После правки перезагрузи консоль.
; Сила везде 1-8, 0 выключает эффект.

; Сколько секунд ждать после запуска игры перед подключением (SaltyNX внедряется в игру при старте)
attach_delay_s=30

; Подробный лог каждого события в log.txt (для отладки), 0 = только важное
verbose=0

; --- R2: лук ---
; Натяжение, когда лук натянут (пока стрела не наложена, R2 свободен)
bow_drawn_strength=8
; Импульс в момент выстрела (почти не ощущается: палец уже отпустил триггер)
bow_release_strength=0

; --- L2: щит ---
; Удар по поднятому щиту: стиль 1 = триггер на миг твердеет, 2 = вибрация
shield_hit_style=2
shield_hit_strength=2
shield_hit_ms=150

; --- Сёрфинг на щите ---
; Постоянная мелкая вибрация обоих триггеров, пока едешь
surf_rumble_strength=2
; Толчок, когда щит изнашивается на сёрфинге
surf_strength=3
; Сколько миллисекунд без износа щита считать, что сёрфинг закончился
surf_timeout_ms=6000

; --- Защита Дарука ---
; Вибрация обоих триггеров, когда аура принимает удар (световая полоса вспыхивает оранжевым в любом случае)
daruk_strength=5

; --- Здоровье ---
; Красное "сердцебиение" световой полосы при этом или меньшем числе четвертей сердца (4 = 1 сердце)
low_health_quarters=4

; --- Отладка (обычно не нужно) ---
; Поиск неизвестных состояний игры: 0 = выкл, 1 = по ZR/ZL, 2 = сёрфинг
search=0
search_offset=0
search_size=4000
; Наблюдение за значениями в памяти, пишет изменения в log.txt. Пример (сердца, проверено):
; watch=hearts main+2CA1A78 80 848 u32
