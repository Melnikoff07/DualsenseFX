; adaptive_triggers config
; Seconds to wait after BotW starts before attaching (SaltyNX injects into the game right after launch)
attach_delay_s=30

; Shield block impact on L2: style 1 = trigger stiffens and pushes back, 2 = vibration
; strength 1-8 (0 = off), duration in milliseconds
shield_hit_style=1
shield_hit_strength=6
shield_hit_ms=200

; R2 resistance once the bow is fully drawn, 1-8 (before that it is light)
bow_drawn_strength=8
; Pulse on R2 when an arrow is shot, 1-8, 0 = off (hard to feel: the finger is already off the trigger)
bow_release_strength=0

; Daruk's Protection blocking a hit: vibration on both triggers, strength 1-8 (0 = off).
; The lightbar flashes orange either way.
daruk_strength=5

; Shield surfing: light vibration on L2 while sliding, strength 1-8 (0 = off). Detection is a hypothesis.
surf_strength=2

; Red heartbeat on the lightbar at or below this many quarter hearts (4 = 1 heart), 0 = off
low_health_quarters=4

; Correlation search for bow drawn / shield raised state (logs candidates to log.txt).
; Region is relative to the player actor; size up to 4000 (hex).
search=0
search_offset=0
search_size=4000

; Watches: values are logged to log.txt whenever they change (for finding new game state).
; Format: watch=name main+OFFSET [OFFSET...] type   (each next offset is added after a pointer read, like cheat codes)
; Verified on BotW 1.6.0 (build 8E9978D50BDD20B4):
;   hearts  main+2CA1A78 80 848 u32   (quarter hearts)
;   stamina main+2C9FD70 38 2AC f32   (max 1800)
watch=hearts main+2CA1A78 80 848 u32
; Verified: bow state, player actor +1F88 (0 none, 1 nocking, 2 drawn, 3 shot)
watch=bow_state main+2CA1A78 80 1F88 u32
; Verified: action flags, player actor +C40 (0x18 ZL stance, 0x40000000 bow aim, 0xC000 Daruk's Protection blocks)
watch=action_C40 main+2CA1A78 80 C40 u32
; Champion abilities (from the "Infinite Powers" cheat: writes 0x63 to +1CC8, +1CCC, +1CD0).
; +1CD0 went 1 -> 3 when Daruk's Protection blocked a hit: likely Daruk's, meaning still unclear.
watch=power_1CC8 main+2CA1A78 80 1CC8 u32
watch=power_1CCC main+2CA1A78 80 1CCC u32
watch=power_1CD0 main+2CA1A78 80 1CD0 u32
watch=power_1CD4 main+2CA1A78 80 1CD4 u32
