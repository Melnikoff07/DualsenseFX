; adaptive_triggers: DualSense adaptive triggers for Breath of the Wild 1.6.0
; Lines starting with ';' are comments. Reboot the console after editing.
; Strengths are 1-8 everywhere, 0 turns the effect off.

; Seconds to wait after the game starts before attaching (SaltyNX injects into the game at launch)
attach_delay_s=30

; Log every gameplay event to log.txt (for debugging), 0 = important messages only
verbose=0

; --- R2: bow ---
; Tension once the bow is drawn (R2 is free until an arrow is nocked)
bow_drawn_strength=8
; Pulse when an arrow is shot (barely noticeable: the finger has already left the trigger)
bow_release_strength=0

; --- L2: shield ---
; Hit on a raised shield: style 1 = the trigger stiffens for a moment, 2 = vibration
shield_hit_style=2
shield_hit_strength=2
shield_hit_ms=150

; --- Shield surfing ---
; Continuous light rumble on both triggers while surfing
surf_rumble_strength=2
; Pulse when the shield wears down while surfing
surf_strength=3
; Milliseconds without shield wear after which surfing is considered over
surf_timeout_ms=6000

; --- Daruk's Protection ---
; Vibration on both triggers when the barrier blocks a hit (the lightbar flashes orange either way)
daruk_strength=5

; --- HD haptics patterns ---
; Felt patterns for game events on the DualSense voice coils: weapon hits (sword / two-handed / spear), shield blocks,
; bow nock / drawn string / release, damage, healing, heartbeat at low health, Daruk's Protection, weapon breaking,
; landing after a fall, shield surfing, running out of stamina. Needs dualsense_hd_haptics=true in
; config/MissionControl/missioncontrol.ini. They are mixed with the game's own rumble.
; Where the haptics go: 1 = DualSense (through MissionControl, with adaptive triggers and lightbar),
; 2 = Joy-Con / Pro Controller HD rumble, 0 = off
output=1
; Adaptive trigger effects (bow, shield, surfing ...), 0 = plain triggers. DualSense only
triggers=1
haptics=1
; Strength of all patterns in percent, 0-200
haptics_strength=100
; Strength per group in percent, 0-200, 0 turns the group off:
;  combat: weapon hits, shield, bow, weapon breaking, Daruk
;  body: damage, healing, heartbeat, stamina, landing after a fall, surfing
;  runes: bombs, Magnesis, Stasis, Cryonis
;  world (from the game's sounds): water, swimming, chests, items, rolling, jumping, climbing, crates
;  footsteps (from the game's step sounds): heel and toe, with a texture for the ground
combat_strength=100
body_strength=100
rune_strength=100
world_strength=100
footstep_strength=50
; Changes to this file are applied within a second, no reboot needed (the overlay writes it too)

; --- Health ---
; Red heartbeat on the lightbar at or below this many quarter hearts (4 = 1 heart)
low_health_quarters=4

; --- Debugging (normally not needed) ---
; Search for unknown game state: 0 = off, 1 = by ZR/ZL hold, 2 = shield surfing, 3 = rune in use (after L)
search=0
search_offset=0
; search_base=rune searches the RuneMgr instance instead of the player actor
; region in the player actor (hex), size up to 8000
search_size=4000
; --- Network control for development (off by default) ---
; Lets tools/swnet.py on a computer in the same network read game memory, try haptics live and move project files.
; Use only on your home network; the token is the password.
net=0
net_token=
net_port=7330

; Research: copy the game's main module to main.bin in this folder (about 47 MB, stays on your SD card)
dump_main=0
; Log changes of a value in game memory. Example (hearts, verified):
; watch=hearts main+2CA1A78 80 848 u32
