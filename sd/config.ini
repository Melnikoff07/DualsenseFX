; adaptive_triggers config
; Seconds to wait after BotW starts before attaching (SaltyNX injects into the game right after launch)
attach_delay_s=30

; Shield block impact pulse on L2: strength 1-8 (0 = off), duration in milliseconds
shield_hit_strength=4
shield_hit_ms=200

; Watches: values are logged to log.txt whenever they change (for finding new game state).
; Format: watch=name main+OFFSET [OFFSET...] type   (each next offset is added after a pointer read, like cheat codes)
; Verified on BotW 1.6.0 (build 8E9978D50BDD20B4):
;   hearts  main+2CA1A78 80 848 u32   (quarter hearts)
;   stamina main+2C9FD70 38 2AC f32   (max 1800)
watch=hearts main+2CA1A78 80 848 u32
