; Haptic patterns, applied within a second after saving (no reboot).
; [name] then group = combat | body | runes | world | footsteps, and up to 4 voices:
;   voice = sine|noise  left right  freq_start freq_end  delay attack hold decay
; amplitudes 0-255 per hand (the right hand holds the weapon, the left one the shield and the bow), Hz, ms.
; Loops (bow tension, surf, magnesis hum, stamina refill) hold while their state lasts; "step <ground>" are
; the footstep taps. New sections become new patterns that sounds.ini can use.

[hit sword]
group = combat
voice = sine  120 230  220  130    0    2   12   70
voice = noise  90 160  180  180    0    1    8   60

