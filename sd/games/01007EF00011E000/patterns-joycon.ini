; Zelda: Breath of the Wild, Joy-Con / Pro Controller versions of the patterns (used while output=2).
; Same sections and voice lines as patterns.ini:
;   voice = sine|noise  left right  freq_start freq_end  delay attack hold decay   (amplitude 0-255, Hz, ms)
; group and strength come from patterns.ini, so the overlay's sliders work for both outputs. A pattern missing here is
; made from its DualSense voices automatically. Applied within a second after saving.
;
; How these are made: a Joy-Con has one small linear resonant actuator per hand, driven with a low and a high band.
; It answers strongly near 160 Hz (low band, ~100-250 Hz) and 320 Hz (high band) and hardly at the 30-60 Hz the
; DualSense patterns use for weight. So weight here is a knock near 140-180 Hz falling towards 100 Hz, edges and
; clicks are short 300-340 Hz pulses, textures are jittered high band noise. Values change every 5 ms at best, so
; every voice lasts at least 15 ms.

