; Which game sounds play which haptic pattern. Applied within a second after saving (no reboot).
; mask = action [strength %]   '*' matches anything, the first matching line wins.
; action: a pattern name from patterns.ini, "step" (footstep: ground, pace, heel / toe and foot from the name),
;         "step <ground>" (footstep on that ground), or "ignore".
; Sound names can be seen with the sound log tool (tools/sndlog.py) while playing.

; Footsteps: Mt_<ground>_Pl_Move<Slow|Normal|Fast|Naked>_<Heel|Toe><L|R>NN
Mt_*_Pl_Move* = step
Water_Pl_MoveShallow* = step water

; Body
Mt_*_Pl_Land*Weak* = land
Mt_*_Pl_Land* = landing
Mt_*_Pl_Jump* = jump
Mt_*_Pl_Climb* = climb grip
Pl_FrontRoll* = roll

; Water
Water_In_Small* = water splash 60
Water_In_* = water splash
Water_Pl_SwimHand* = swim stroke

; World
Tbox*Open* = chest open
Pl_Get* = item get
SYS_ItemGet* = item get
WoodBox_Break* = crate break
