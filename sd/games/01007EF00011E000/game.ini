; DualsenseFX game profile. The module attaches to a game only when its folder has a game.ini with enabled=1.
name = The Legend of Zelda: Breath of the Wild
enabled = 1
; Main module build ids (first 8 bytes, hex) the addresses were found on, comma separated. Empty: any build.
; The built-in BotW logic (inventory, bow, runes, surfing) only runs on 8E9978D50BDD20B4 (1.6.0).
builds = 8E9978D50BDD20B4
; nn::atk sound pool for the sound driven haptics (sounds.ini): [main + sound_archive_player] + sound_pool
; points to 64 WaveSound objects whose vtable is main + wave_sound_vtable. Hex offsets.
sound_archive_player = 2CC1670
sound_pool = 128
wave_sound_vtable = 2C17828
